# XcodeGen spec — `brew install xcodegen && xcodegen generate` produces Butler.xcodeproj.
name: Butler
options:
  bundleIdPrefix: com.conforcus
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ButlerCore:
    path: ButlerCore

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_STRICT_CONCURRENCY: minimal
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  Butler:
    type: application
    platform: iOS
    sources:
      - path: Butler
    dependencies:
      - package: ButlerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conforcus.butler
        PRODUCT_NAME: Butler
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: Butler
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    info:
      path: Butler/Info.plist
      properties:
        CFBundleDisplayName: Butler
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        CFBundleURLTypes:
          - CFBundleURLName: com.conforcus.butler.signin
            CFBundleURLSchemes: [butler]
        NSAppTransportSecurity:
          # Local `bun run dev` demo is plain http; production is https only.
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
