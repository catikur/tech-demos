# Isolated paper desk for atlas.conforcus.com
# Publishes only on loopback:3047 so it cannot steal :80/:443 from the existing Caddy.
# Point Caddy at 127.0.0.1:3047 (see Caddyfile.atlas).

name: atlas-gic

services:
  atlas-gic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-gic
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      PUBLIC_URL: "https://atlas.conforcus.com"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    volumes:
      - atlas-gic-data:/app/data
    ports:
      - "127.0.0.1:3047:3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) })",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  atlas-gic-data:
